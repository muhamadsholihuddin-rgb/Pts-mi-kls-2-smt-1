function home(){clearInterval(T);const b=best();
$.innerHTML=`<h1>📚 Kuis Mahda</h1><p class="s">Kelas 2 MI · Semester 1 — pilih pelajaran!</p><div class="grid">`+
S.map((s,k)=>`<div class="card" onclick="start(${k})"><b>${s.i}</b>${s.n}<small>${s.q.length} soal${b[k]!=null?" · terbaik "+b[k]+"%":""}</small></div>`).join("")+`</div>`}
function start(k,only){st={k,qs:sh(only||S[k].q),n:0,ok:0,bad:[],t0:Date.now()};show()}
function show(){const q=st.qs[st.n],o=sh(q[1].map((t,i)=>[t,i==q[2]]));st.o=o;st.done=0;st.t=TL;clearInterval(T);T=setInterval(tick,1000);
$.innerHTML=`<div class="bar"><i style="width:${st.n/st.qs.length*100}%"></i></div><small>${S[st.k].n} · Soal ${st.n+1}/${st.qs.length}</small><div class="tm" id="tm">⏱️ ${TL} detik</div>
<div class="q" dir="auto">${q[0]}</div>`+o.map((x,i)=>`<button class="opt" dir="auto" onclick="pick(${i})">${x[0]}</button>`).join("")+`<div class="fb" id="fb"></div><div id="nx"></div>`}
function pick(i){if(st.done)return;st.done=1;clearInterval(T);const b=document.querySelectorAll(".opt"),r=i>=0&&st.o[i][1];
st.o.forEach((x,j)=>{if(x[1])b[j].classList.add("ok")});
if(r)st.ok++;else{if(i>=0)b[i].classList.add("no");st.bad.push(st.qs[st.n])}
document.getElementById("fb").textContent=i<0?"Waktu habis! ⏰ Ayo lebih cepat!":r?"Benar! Hebat! 🎉":"Belum tepat, ayo semangat! 💪";
const last=st.n==st.qs.length-1;
document.getElementById("nx").innerHTML=`<button class="btn" onclick="${last?"end()":"st.n++;show()"}">${last?"Lihat Nilai 🏆":"Lanjut ➜"}</button>`}
function end(){const p=Math.round(st.ok/st.qs.length*100);save(st.k,p);
const e=p>=90?"🏆":p>=70?"🌟":p>=50?"👍":"💪";
$.innerHTML=`<div class="big">${e}</div><h1>Nilai: ${p}</h1><p class="s">${st.ok} benar dari ${st.qs.length} soal · waktu ${Math.round((Date.now()-st.t0)/1000)} detik</p>`+
(st.bad.length?`<button class="btn" onclick="start(${st.k},st.bad)">Ulangi soal yang salah (${st.bad.length})</button>`:"")+
`<button class="btn g" onclick="start(${st.k})">Main lagi</button><button class="btn g" onclick="home()">Menu utama</button>`}
home();
</script></body></html>
